name = "absenyuk"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Binding KV untuk session login.
# Setelah buat namespace (lihat langkah di README), isi "id" di bawah
# dengan ID yang muncul dari perintah wrangler.
[[kv_namespaces]]
binding = "SESSIONS"
id = "614e992ccfd643b8ac628d0de257937b"

# CATATAN: SUPABASE_URL & SUPABASE_SERVICE_ROLE_KEY TIDAK ditaruh di sini.
# Keduanya harus disimpan sebagai Worker Secrets (wrangler secret put),
# bukan di file ini, supaya tidak ikut ter-commit ke Git.

# Cron Triggers - jadwal otomatis notifikasi & auto-alpa.
# Field ke-5 (hari) = "1-5" -> Senin s.d. Jumat saja (weekend tidak perlu trigger sama
# sekali, karena memang bukan hari kerja). Pengecekan hari libur NASIONAL/khusus sekolah
# tetap dilakukan di dalam kode (checkApakahHariLibur), karena itu tanggal dinamis yang
# tidak bisa diwakili lewat cron expression statis.
# Waktu dalam UTC (WIB = UTC+7):
#   "20 0 * * 1-5" -> 07:20 WIB, Senin-Jumat - pengingat belum absen (FCM)
#   "20 5 * * 1-5" -> 12:20 WIB, Senin-Jumat - auto set "Tanpa Keterangan" (Absen Masuk)
#   "0 14 * * 1-5" -> 21:00 WIB, Senin-Jumat - auto set "Tidak Absen" Sholat Dzuhur & Ashar sekaligus
[triggers]
crons = ["20 0 * * 1-5", "20 5 * * 1-5", "0 14 * * 1-5"]
