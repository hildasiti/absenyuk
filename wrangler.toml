name = "absenyuk"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Binding KV untuk session login.
# Setelah buat namespace (lihat langkah di README), isi "id" di bawah
# dengan ID yang muncul dari perintah wrangler.
[[kv_namespaces]]
binding = "SESSIONS"
id = "614e992ccfd643b8ac628d0de257937b"

# CATATAN: SUPABASE_URL & SUPABASE_SERVICE_ROLE_KEY TIDAK ditaruh di sini.
# Keduanya harus disimpan sebagai Worker Secrets (wrangler secret put),
# bukan di file ini, supaya tidak ikut ter-commit ke Git.

# Cron Triggers - jadwal otomatis notifikasi & auto-alpa.
# CATATAN PENTING: field ke-5 (hari) sengaja dibiarkan "*" (jalan tiap hari), BUKAN
# dibatasi "1-5" (Senin-Jumat) di level cron. Dashboard Cloudflare menampilkan label
# hari yang tidak konsisten dengan standar cron Unix biasa (0=Minggu...6=Sabtu) saat
# dicoba pakai "1-5" - untuk menghindari risiko cron benar-benar jalan di hari yang
# salah, pembatasan Senin-Jumat SEPENUHNYA diserahkan ke pengecekan di dalam kode
# (nowJakarta().dayOfWeek di date.js, sudah pasti benar karena pakai Intl API standar) -
# tiap fungsi (cekDanKirimNotifikasiBelumAbsen, autoSetTanpaKeterangan,
# autoSetTidakAbsenSholat) langsung return kalau hari ini Sabtu/Minggu. Worker tetap
# jalan tiap hari termasuk weekend, cuma langsung berhenti tanpa melakukan apa-apa -
# sedikit invocation ekstra yang sia-sia, tapi jauh lebih aman daripada salah hari.
# Waktu dalam UTC (WIB = UTC+7):
#   "20 0 * * *" -> 07:20 WIB - pengingat belum absen (FCM); di-skip di kode kalau weekend/libur
#   "20 5 * * *" -> 12:20 WIB - auto set "Tanpa Keterangan" (Absen Masuk); di-skip di kode kalau weekend/libur
#   "0 14 * * *" -> 21:00 WIB - auto set "Tidak Absen" Sholat Dzuhur & Ashar; di-skip di kode kalau weekend/libur
[triggers]
crons = ["20 0 * * *", "20 5 * * *", "0 14 * * *"]
